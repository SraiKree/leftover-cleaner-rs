[package]
name = "leftover-cleaner-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance Windows leftover cleaner — scans registry + filesystem for residue after uninstallation"
authors = ["Reconstructed from Geek Uninstaller"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yourusername/leftover-cleaner-rs"
keywords = ["windows", "uninstaller", "cleaner", "registry", "leftover"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_ComponentServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Diagnostics_ToolHelp"
] }
winreg = "0.51"
rayon = "1.8"
crossbeam-channel = "0.5"
jwalk = "0.8"
strsim = "0.10"
regex = "1.10"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0