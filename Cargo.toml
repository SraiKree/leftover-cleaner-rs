[package]
name = "leftover-cleaner-rs"
version = "0.1.0"
edition = "2021"
description = "A Windows CLI tool for safely removing leftover files and registry entries after uninstallation"
authors = ["Your Name"]
license = "MIT"
readme = "README.md"

[dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_ComponentServices",
    "Win32_System_Registry"
] }
winreg = "0.51"
rayon = "1.8"
crossbeam-channel = "0.5"
jwalk = "0.8"
strsim = "0.10"
regex = "1.10"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.25"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0